<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="description" content="Acompanhe seus treinos e registre cargas e repetições.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Meu Treino</title>
<style>
:root{--bg:#05070b;--card:#0e131c;--ink:#eaf1ff;--mute:#8b9bb8;--line:#1f2a3d;--acc:#2f80ff;--ic:#142038;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:34px;margin:6px 0 2px;font-weight:700;letter-spacing:.2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;min-width:84px;padding:10px 0;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:12px}
.ico{width:84px;height:84px;border-radius:12px;background:var(--ic);display:grid;place-items:center;flex:none;color:var(--acc)}
.ico svg{width:50px;height:50px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico{border:0;padding:0;overflow:hidden;cursor:pointer;position:relative}
.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.ico img{width:100%;height:100%;object-fit:cover}
.rm{display:block;border:0;background:none;color:var(--acc);font:inherit;font-size:14px;padding:2px 0 0;cursor:pointer}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:21px;line-height:1.1}
.nm span{color:var(--mute);font-size:15px}
.del{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;padding:6px}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.set{display:grid;grid-template-columns:58px 1fr 1fr;gap:8px;align-items:center}
.set label{font-size:15px;color:var(--mute)}
.set div{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);padding-right:8px}
.set input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:20px;font-weight:600;padding:7px 8px;min-width:0;outline:none}
.set div:focus-within{border-color:var(--acc)}
.set small{color:var(--mute);font-size:14px}
.add{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:12px;margin-top:4px}
.add summary{cursor:pointer;font-weight:600;color:var(--acc)}
.add .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add input,.add select{flex:1;min-width:90px;padding:9px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:10px 16px;border:0;border-radius:9px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.foot{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.empty{color:var(--mute);text-align:center;padding:24px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<h1>Meu treino</h1>
<p class="sub" id="sub"></p>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="list"></div>
<details class="add">
  <summary>Adicionar exercício</summary>
  <div class="row">
    <input id="n" placeholder="Nome do exercício">
    <input id="s" type="number" min="1" max="10" value="3" aria-label="Séries">
    <input id="r" placeholder="Reps (8-12)" aria-label="Repetições">
    <select id="t" aria-label="Ícone">
      <option value="barbell">Barra</option><option value="dumbbell">Halteres</option>
      <option value="cable">Polia / máquina</option><option value="squat">Pernas</option><option value="body">Peso do corpo</option>
    </select>
    <button class="btn" id="addb">Adicionar</button>
  </div>
</details>
<div class="foot"><button class="btn ghost" id="clr">Limpar pesos do treino</button></div>

<details class="add" id="backup">
  <summary>Backup dos dados</summary>
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 0">
    <button class="btn" id="exportb" type="button">Exportar backup</button>
    <button class="btn ghost" id="importb" type="button">Importar backup</button>
    <input id="backupfile" type="file" accept="application/json,.json" hidden>
  </div>
  <p class="sub">O backup inclui treinos, cargas, repetições e imagens personalizadas. Guarde o arquivo exportado em outro local.</p>
</details>

function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
 if(!S){S={plans:{},w:{}};for(var k in DEF)S.plans[k]=DEF[k].map(function(e){return{n:e[0],t:e[1],s:e[2],r:e[3]}})}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function names(){return Object.keys(S.plans)}
function tabs(){var el=document.getElementById("tabs");el.innerHTML="";
 names().forEach(function(k,i){var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");
  b.setAttribute("aria-selected",i===cur);b.textContent=k.split(" · ")[0];b.onclick=function(){cur=i;render()};el.appendChild(b)})}
function render(){tabs();var k=names()[cur],L=S.plans[k],list=document.getElementById("list");
 document.getElementById("sub").textContent=k.split(" · ")[1]+" — "+L.length+" exercícios"+(REST[k]?". "+REST[k]:"");list.innerHTML="";
 if(!L.length){list.innerHTML='<div class="empty">Nenhum exercício. Adicione o primeiro abaixo.</div>'}
 L.forEach(function(e,i){var c=document.createElement("div");c.className="ex";
  c.innerHTML='<div class="top"><label class="ico" aria-label="Trocar imagem"><input type="file" accept="image/*" class="fi">'+(S.img&&S.img[k+"|"+e.n]?'<img alt="" src="'+S.img[k+"|"+e.n]+'">':'<svg viewBox="0 0 24 24">'+ICONS[e.t]+'</svg>')+'</label><div class="nm"><b></b><span>'+e.s+' séries'+(e.r?' · '+e.r+' reps':'')+'</span></div><button class="del" aria-label="Remover">×</button></div><div class="sets"></div>';
  c.querySelector("b").textContent=e.n;var iid=k+"|"+e.n;c.querySelector(".fi").onchange=function(){handle(iid,this.files[0])};
  if(S.img&&S.img[iid]){var rm=document.createElement("button");rm.className="rm";rm.textContent="remover imagem";rm.onclick=function(){S.img[iid]=null;save();render()};c.querySelector(".nm").appendChild(rm)}
  c.querySelector(".del").onclick=function(){L.splice(i,1);save();render()};
  var box=c.querySelector(".sets");
  for(var j=0;j<e.s;j++){(function(j){var id=k+"|"+e.n+"|"+j,d=document.createElement("div");d.className="set";
   d.innerHTML='<label>Série '+(j+1)+'</label><div><input class="kg" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0"><small>kg</small></div><div><input class="rp" type="number" inputmode="numeric" min="0" placeholder="'+(e.r||'0')+'"><small>reps</small></div>';
   var a=d.querySelector('.kg'),b=d.querySelector('.rp');a.value=S.w[id]||'';b.value=S.rp[id]||'';
   a.oninput=function(){S.w[id]=a.value;save()};b.oninput=function(){S.rp[id]=b.value;save()};box.appendChild(d)})(j)}
  list.appendChild(c)})}
function handle(id,file){if(!file)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var z=112,c=document.createElement("canvas");c.width=c.height=z;var m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);S.img=S.img||{};S.img[id]=c.toDataURL("image/jpeg",.8);save();render()};im.src=rd.result};rd.readAsDataURL(file)}
document.getElementById("addb").onclick=function(){var n=document.getElementById("n").value.trim();if(!n)return;
 S.plans[names()[cur]].push({n:n,t:document.getElementById("t").value,s:Math.max(1,Math.min(10,+document.getElementById("s").value||3)),r:document.getElementById("r").value.trim()});
 document.getElementById("n").value="";save();render()};
document.getElementById("clr").onclick=function(){var k=names()[cur];
 Object.keys(S.w).forEach(function(x){if(x.indexOf(k+"|")===0)delete S.w[x]});Object.keys(S.rp).forEach(function(x){if(x.indexOf(k+"|")===0)delete S.rp[x]});save();render()};

document.getElementById("exportb").onclick=function(){
 var blob=new Blob([JSON.stringify({app:"Meu Treino",version:1,exportedAt:new Date().toISOString(),data:S},null,2)],{type:"application/json"});
 var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="meu-treino-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)
};
document.getElementById("importb").onclick=function(){document.getElementById("backupfile").click()};
document.getElementById("backupfile").onchange=function(){var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var obj=JSON.parse(rd.result),data=obj.data||obj;if(!data||!data.plans||typeof data.plans!=="object")throw new Error("Formato inválido");if(confirm("Importar este backup vai substituir os dados atuais deste aparelho. Deseja continuar?")){S=data;S.w=S.w||{};S.rp=S.rp||{};S.img=S.img||{};save();cur=0;render();alert("Backup importado.")}}catch(e){alert("Não foi possível importar: arquivo inválido.")}};rd.readAsText(f);this.value=""};
load();S.rp=S.rp||{};if(!S.v3){for(var pk in S.plans)S.plans[pk].forEach(function(e){e.s=3});S.v3=1;save()}S.img=S.img||{};for(var q in PRE){if(!(q in S.img))S.img[q]=PRE[q]}if(!S.pv2){["Seg · Upper A (Força)|Remada curvada", "Seg · Upper A (Força)|Rosca direta", "Seg · Upper A (Força)|Supino reto", "Seg · Upper A (Força)|Tríceps corda", "Qui · Upper B (Hipertrofia)|Crucifixo máquina", "Seg · Upper A (Força)|Desenvolvimento militar"].forEach(function(q){S.img[q]=PRE[q]});S.pv2=1;save()}render();
